{% extends 'base.html' %}

{% block title %}Register - Online Repair Service{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 2rem auto;">
    <div class="card">
        <div class="card-header" style="justify-content: center;">
            <h2 class="card-title">Create Customer Account</h2>
        </div>
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="john_doe" minlength="3" maxlength="30">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password (min 6 characters)</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••" minlength="6">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Create Account</button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: #64748b;">
            Already have an account? <a href="{{ url_for('auth.login') }}" style="color: #2563eb; font-weight: 600;">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
