{% extends 'base.html' %}

{% block title %}Login - Online Repair Service{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto;">
    <div class="card">
        <div class="card-header" style="justify-content: center;">
            <h2 class="card-title">Sign In to Your Account</h2>
        </div>
        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required autofocus placeholder="e.g. customer1 or staff1">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Log In</button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: #64748b;">
            Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: #2563eb; font-weight: 600;">Register here</a>
        </div>

        <div style="margin-top: 1.5rem; padding: 0.75rem; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 6px; font-size: 0.8rem; color: #475569;">
            <strong>Demo Accounts:</strong><br>
            • Admin: <code>admin</code> / <code>admin123</code><br>
            • Staff: <code>staff1</code> / <code>staff123</code><br>
            • Customer: <code>customer1</code> / <code>customer123</code>
        </div>
    </div>
</div>
{% endblock %}
