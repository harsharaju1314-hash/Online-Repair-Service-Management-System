name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    name: Build, Lint, Test & Docker Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all warnings as non-fatal
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Test Suite
        run: |
          pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t online-repair-service:latest .

      - name: Container Liveness & Health Verification
        run: |
          # Start container in detached background mode
          docker run -d --name repair-app -p 5000:5000 -e SECRET_KEY="ci-test-key" online-repair-service:latest
          
          # Wait for container startup
          sleep 4
          
          # Verify /health endpoint returns 200 OK
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:5000/health || (docker logs repair-app && exit 1)
          
          # Clean up container
          docker stop repair-app
          docker rm repair-app
