name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    name: Build, Lint, Test & Docker Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Flake8)
        run: |
          flake8 .

      - name: Run Pytest Test Suite
        run: |
          pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t online-repair-service:latest .

      - name: Container Liveness & Health Verification
        run: |
          # Launch container in background
          docker run -d --name repair-app -p 5000:5000 -e HOST=0.0.0.0 -e PORT=5000 -e SECRET_KEY="ci-test-key-12345" online-repair-service:latest
          
          # Allow container startup
          sleep 5

          # Probe /health endpoint
          curl --fail --retry 5 --retry-delay 2 http://localhost:5000/health || (docker logs repair-app && exit 1)
          
          # Cleanup
          docker stop repair-app
          docker rm repair-app
